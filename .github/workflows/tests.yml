name: tests

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  # every PR runs the tests: main requires them to pass, so a docs-only PR must report them too
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a new push to the same branch or PR cancels the run still in progress
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04: ubuntu-latest (26.04) has no Python 3.9 builds
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    env:
      # page tests fail instead of being skipped when no browser is found
      TASKGRAPH_REQUIRE_BROWSER: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Ubuntu 24.04 blocks unprivileged user namespaces, which the Chrome sandbox needs.
      - name: Allow the Chrome sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Chrome is preinstalled on macOS runners but not on PATH.
      - name: Point the page tests at Chrome (macOS)
        if: runner.os == 'macOS'
        run: echo "TASKGRAPH_BROWSER=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" >> "$GITHUB_ENV"

      - name: Versions
        shell: bash
        run: |
          python --version
          bash --version | head -1

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      # Smoke test: the plugin puts plugin/bin on PATH, so a session runs plain `fm`
      # (bin/fm in bash, bin/fm.cmd in PowerShell). Run the demo the same way,
      # then the "Try the demo" command from the README.
      - name: Smoke test - fm from PATH (bash)
        shell: bash
        run: |
          export PATH="$PWD/plugin/bin:$PATH"
          command -v fm
          fm --version
          fm examples/demo check
          fm examples/demo show
          fm examples/demo open --no-browser
          if fm examples/demo set nope status=doing; then echo "an error must exit non-zero"; exit 1; fi
          bash plugin/bin/fm examples/demo open --no-browser
          test -f examples/demo/taskgraph.html

      - name: Smoke test - fm from PATH (PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PATH = "$PWD\plugin\bin;" + $env:PATH
          (Get-Command fm).Source
          fm --version; if ($LASTEXITCODE) { exit 1 }
          fm examples/demo show; if ($LASTEXITCODE) { exit 1 }
          fm examples/demo open --no-browser; if ($LASTEXITCODE) { exit 1 }
          fm examples/demo set nope status=doing
          if ($LASTEXITCODE -ne 1) { "an error must exit 1"; exit 1 }
          exit 0
