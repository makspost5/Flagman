schema_version: "1.0"
name: 05-stage-semantics
description: "stage is the last stage finished: code written then review; coding just started keeps the stage."
tags: [worker,stages]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Skill, Bash, PowerShell, Read, Glob, Grep, Edit, Write]
  prompt: |
    Status update for the task SHOP: the code for A1 is written and now waits for code review
    by a teammate. I have also just started coding A2. Update the task graph.
runs: 3
graders:
  - name: a1-code-review
    type: regex
    target: {source: file, path: .tasks/SHOP/taskgraph.js}
    pattern: '"id": "A1",[^{]*?"stage": 1,\s*"status": "review"'
  - name: a2-doing-not-coded
    type: regex
    target: {source: file, path: .tasks/SHOP/taskgraph.js}
    pattern: '"id": "A2",[^{]*?"stage": (-1|0),\s*"status": "doing"'
  - name: a3-untouched
    type: regex
    target: {source: file, path: .tasks/SHOP/taskgraph.js}
    pattern: '"id": "A3",[^{]*?"stage": -1,\s*"status": "todo"'
  - name: no-edit-taskgraph
    type: tool_used
    tool: Edit
    input_match: 'taskgraph\.js'
    min: 0
    max: 0
    arm: both
  - name: no-write-taskgraph
    type: tool_used
    tool: Write
    input_match: 'taskgraph\.js'
    min: 0
    max: 0
    arm: both
  - name: no-shell-write-taskgraph
    type: regex
    target: trace
    match: not_contains
    pattern: '(\s>>?\s*|Set-Content\s+(-Path\s+)?|Out-File\s+(-FilePath\s+)?|Add-Content\s+(-Path\s+)?|sed\s+-i\S*\s.{0,80}?|\btee\s+(-a\s+)?)\W{0,2}[^\s"'']*taskgraph\.js'
  - name: no-bash-in-powershell
    type: tool_used
    tool: PowerShell
    input_match: '^\s*bash\s'
    min: 0
    max: 0
    arm: both
