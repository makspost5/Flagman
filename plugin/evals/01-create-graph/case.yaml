schema_version: "1.0"
name: 01-create-graph
description: "The architect builds a new graph with fm: items, a session, dependencies with a stage."
tags: [architect]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Skill, Bash, PowerShell, Read, Glob, Grep, Edit, Write]
  prompt: |
    Make a task graph for the task SHOP. Its folder .tasks/SHOP already exists and is empty.
    Items: A1 "Cart"; A2 "Checkout", which can start as soon as the code of A1 is written;
    A3 "Order emails", after A2 is completely finished. One session 01 named shop does all three,
    in that order. Check the graph when you are done.
runs: 3
graders:
  - name: written-by-fm
    type: regex
    target: {source: file, path: .tasks/SHOP/taskgraph.js}
    pattern: '^// Task graph data\. Written by fm'
    flags: m
  - name: three-items
    type: regex
    target: {source: file, path: .tasks/SHOP/taskgraph.js}
    pattern: '"id": "A1",[\s\S]*"id": "A2",[\s\S]*"id": "A3",'
  - name: a2-needs-a1-code
    type: regex
    target: {source: file, path: .tasks/SHOP/taskgraph.js}
    pattern: '"id": "A2",[^{]*?"deps": \[\s*\{\s*"id": "A1",\s*"stage": 1,'
  - name: a3-needs-a2-finished
    type: regex
    target: {source: file, path: .tasks/SHOP/taskgraph.js}
    pattern: '"id": "A3",[^{]*?"deps": \[\s*\{\s*"id": "A2",\s*("stage": 5,\s*)?"note"'
  - name: session-01
    type: regex
    target: {source: file, path: .tasks/SHOP/taskgraph.js}
    pattern: '"sessions": \[\s*\{\s*"id": "01",'
  - name: items-in-session
    type: regex
    target: {source: file, path: .tasks/SHOP/taskgraph.js}
    pattern: '"id": "A3",[^{]*?"session": "01",'
  - name: used-fm-init
    type: regex
    target: trace
    pattern: '\bfm(\.cmd)?\W{0,3}\s+\W{0,2}\S*SHOP\S*\s+init\b'
  - name: ran-fm-check
    type: regex
    target: trace
    pattern: '\bfm(\.cmd)?\W{0,3}\s+\W{0,2}\S*SHOP\S*\s+check\b'
  - name: check-passed
    type: llm
    focus: trace
    criteria: |
      - The agent ran `fm SHOP check` (or the same command with a path to the task folder) at least once.
      - The output of the LAST such check command is `ok`, not a list of problems.
  - name: no-edit-taskgraph
    type: tool_used
    tool: Edit
    input_match: 'taskgraph\.js'
    min: 0
    max: 0
    arm: both
  - name: no-write-taskgraph
    type: tool_used
    tool: Write
    input_match: 'taskgraph\.js'
    min: 0
    max: 0
    arm: both
  - name: no-shell-write-taskgraph
    type: regex
    target: trace
    match: not_contains
    pattern: '(\s>>?\s*|Set-Content\s+(-Path\s+)?|Out-File\s+(-FilePath\s+)?|Add-Content\s+(-Path\s+)?|sed\s+-i\S*\s.{0,80}?|\btee\s+(-a\s+)?)\W{0,2}[^\s"'']*taskgraph\.js'
  - name: no-bash-in-powershell
    type: tool_used
    tool: PowerShell
    input_match: '^\s*bash\s'
    min: 0
    max: 0
    arm: both
