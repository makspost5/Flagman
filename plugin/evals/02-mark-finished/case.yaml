schema_version: "1.0"
name: 02-mark-finished
description: "A worker session reports an item finished; the skill marks it done with fm."
tags: [worker]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Skill, Bash, PowerShell, Read, Glob, Grep, Edit, Write]
  prompt: |
    I've finished A1 (Cart) in the task SHOP: it is merged and done. Update the task graph.
runs: 3
graders:
  - name: a1-done
    type: regex
    target: {source: file, path: .tasks/SHOP/taskgraph.js}
    pattern: '"id": "A1",[^{]*?"stage": 5,\s*"status": "done"'
  - name: others-untouched
    type: regex
    target: {source: file, path: .tasks/SHOP/taskgraph.js}
    pattern: '"id": "A2",[^{]*?"stage": -1,\s*"status": "todo"'
  - name: used-fm-done-set-next
    type: regex
    target: trace
    pattern: '\bfm(\.cmd)?\W{0,3}\s+\W{0,2}\S*SHOP\S*\s+(done|set|next)\s+A1\b'
  - name: no-edit-taskgraph
    type: tool_used
    tool: Edit
    input_match: 'taskgraph\.js'
    min: 0
    max: 0
    arm: both
  - name: no-write-taskgraph
    type: tool_used
    tool: Write
    input_match: 'taskgraph\.js'
    min: 0
    max: 0
    arm: both
  - name: no-shell-write-taskgraph
    type: regex
    target: trace
    match: not_contains
    pattern: '(\s>>?\s*|Set-Content\s+(-Path\s+)?|Out-File\s+(-FilePath\s+)?|Add-Content\s+(-Path\s+)?|sed\s+-i\S*\s.{0,80}?|\btee\s+(-a\s+)?)\W{0,2}[^\s"'']*taskgraph\.js'
  - name: no-bash-in-powershell
    type: tool_used
    tool: PowerShell
    input_match: '^\s*bash\s'
    min: 0
    max: 0
    arm: both
